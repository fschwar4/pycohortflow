# Run with:
#     uv tool install pre-commit && pre-commit install
#     (or: pipx install pre-commit && pre-commit install)
# Then the hooks below run automatically before every `git commit`.
# CI runs the same hooks (lint job in .github/workflows/ci.yml).

repos:
  # Lint and format-check Python sources.  CI runs these same hooks, so
  # this `rev:` is the only Ruff pin: one version for local commits, CI
  # and the manual fixers below.  Dependabot bumps it
  # (.github/dependabot.yml); Ruff is deliberately not in the `dev` extras.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # `files:` limits Ruff to src/ and tests/.  Without it,
      # pre-commit also scans examples/,
      # scripts/ and docs/ — those have pre-existing lint debt and
      # widening the scope here would block unrelated commits.
      - id: ruff-check
        files: ^(src|tests)/.*\.(py|ipynb)$
      - id: ruff-format
        args: [--check]
        files: ^(src|tests)/.*\.(py|ipynb)$
      # Manual fixers, same Ruff version.  `stages: [manual]` keeps them
      # out of `git commit` and CI; they run only on demand:
      #     pre-commit run --hook-stage manual ruff-fix --all-files
      # Both share the alias `ruff-fix` and run in this order: lint fixes
      # first, then formatting.  pre-commit reports "Failed" when they
      # changed files: review the diff and stage it.
      - id: ruff-check
        alias: ruff-fix
        args: [--fix]
        stages: [manual]
        files: ^(src|tests)/.*\.(py|ipynb)$
      - id: ruff-format
        alias: ruff-fix
        stages: [manual]
        files: ^(src|tests)/.*\.(py|ipynb)$

  # Strip outputs and execution counts from any committed Jupyter
  # notebook.  Prevents personal paths and intermediate state from
  # leaking into the repository (notebook source is preserved as-is;
  # only the `outputs` and `execution_count` fields are cleared).
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: sync-roadmap
        name: sync roadmap (docs/roadmap.rst → README.md)
        entry: python scripts/sync_roadmap.py
        # `language: python` runs the script in a hook-managed virtualenv,
        # so it does not need a `python` executable on PATH (macOS with
        # Homebrew only has `python3`).  The script is stdlib-only.
        language: python
        files: '^(docs/roadmap\.rst|README\.md|scripts/sync_roadmap\.py)$'
        pass_filenames: false
        # If the script modifies README, pre-commit reports the file as
        # changed and stops the commit. Stage the new README and try
        # again — that's the auto-sync feedback loop.
