name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      # Runs the hooks from .pre-commit-config.yaml: Ruff check and format
      # check (version pinned by `rev:` there), nbstripout, roadmap sync.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      # Unit tests plus the example notebook (examples/example_cfd.ipynb,
      # all built-in styles), executed end to end by nbmake.
      - name: Run tests
        run: pytest -v --nbmake
